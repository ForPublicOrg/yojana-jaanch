        function LoadDiv(url) {

            var img = new Image();
            var bcgDiv = document.getElementById("divBackground");
            var imgDiv = document.getElementById("divImage");
            var imgFull = document.getElementById("imgFull");
            var imgLoader = document.getElementById("imgLoader");
            var close = document.getElementById("btnClose");

            imgLoader.style.display = "block";
            close.style.display = "inline";

            img.src = url;

            img.onload = function () {
                imgFull.src = img.src;
                imgFull.style.display = "block";
                imgLoader.style.display = "none";
                close.style.display = "inline";
            };


            var width = document.body.clientWidth;
            if (document.body.clientHeight > document.body.scrollHeight) {
                bcgDiv.style.height = document.body.clientHeight + "px";
            }
            else {
                bcgDiv.style.height = document.body.scrollHeight + "px";
            }
            imgDiv.style.left = (width - 650) / 2 + "px";
            imgDiv.style.top = "20px";
            bcgDiv.style.width = "100%";

            bcgDiv.style.display = "block";
            imgDiv.style.display = "block";
            return false;
        }

        function HideDiv() {
            var bcgDiv = document.getElementById("divBackground");
            var imgDiv = document.getElementById("divImage");
            var imgFull = document.getElementById("imgFull");
            if (bcgDiv != null) {
                bcgDiv.style.display = "none";
                imgDiv.style.display = "none";

        <script nonce="sULARLHDb9Q05wR+/wxvrg==" type="text/javascript">

            function openFeedback(encryptedId) {

                var width = 700;
                var height = 650;

                var left = (screen.width - width) / 2;
                var top = (screen.height - height) / 2;

                var url = '/feedback.aspx?id=' +
                    encodeURIComponent(encryptedId);

                var popup = window.open(
                    url,
                    'Feedback',
                    'width=' + width +
                    ',height=' + height +
                    ',top=' + top +
                    ',left=' + left +
                    ',resizable=yes,scrollbars=yes'
                );

                if (!popup) {
                    alert('Please allow popups for this website.');
                }
            }

            document.addEventListener('click', function (event) {

                var element = event.target;

                while (element && element !== document) {

                    if (element.classList &&
                        element.classList.contains('feedback-link')) {

                        event.preventDefault();

                        var encryptedId = element.getAttribute('data-id');

                        if (encryptedId) {
                            openFeedback(encryptedId);
                        }

                        return;
                    }

                    element = element.parentNode;
                }

            });

        </script>

        <script nonce="sULARLHDb9Q05wR+/wxvrg==" type="text/javascript">
            // body onload ki jagah
            window.addEventListener("load", FocusOnInput);

            // Delegated click listener: UpdatePanel partial postback ke baad bhi chalta hai
            document.addEventListener("click", function (e) {
                var t = e.target;
                if (!t || !t.closest) { return; }

                // GridView pager links: href="javascript:__doPostBack('gvData','Page$2')"
                // javascript: URL CSP mein block hota hai, isliye href parse karke khud __doPostBack call karte hain
                var pgLink = t.closest('a[href^="javascript:__doPostBack"]');
                if (pgLink) {
                    var m = /__doPostBack\('([^']*)'\s*,\s*'([^']*)'\)/.exec(pgLink.getAttribute("href"));
                    if (m) {
                        e.preventDefault();
                        __doPostBack(m[1], m[2]);
                    }
                    return;
                }

                // Grid ke image links (img-1 / img-2)
                var imgLink = t.closest("a.img-view");
                if (imgLink) {
                    e.preventDefault();
                    LoadDiv(imgLink.getAttribute("data-url"));
                    return;
                }

                // Image popup ka close button
                if (t.id === "btnClose") {
                    HideDiv();
                    return;
                }

                // Search button: client-side validation (btnSearch par CausesValidation=false hai)
                if (t.id === "btnSearch") {
                    if (typeof Page_ClientValidate === "function" && !Page_ClientValidate("btnsearch")) {
                        e.preventDefault();
                    }
                }
            });

            // DropDownList ke auto postback ki jagah
            document.addEventListener("change", function (e) {
                var t = e.target;
                if (t && t.classList && t.classList.contains("js-autopostback")) {
                    __doPostBack(t.name, "");
                }
            });
        </script>
