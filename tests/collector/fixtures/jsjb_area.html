        <script nonce="PjL3k8oXn5tvfIigOc/iOg==" type="text/javascript">

            function openFeedback(encryptedId) {

                var width = 700;
                var height = 650;

                var left = (screen.width - width) / 2;
                var top = (screen.height - height) / 2;

                var url = '/feedback.aspx?id=' +
                    encodeURIComponent(encryptedId);

                var popup = window.open(
                    url,
                    'Feedback',
                    'width=' + width +
                    ',height=' + height +
                    ',top=' + top +
                    ',left=' + left +
                    ',resizable=yes,scrollbars=yes'
                );

                if (!popup) {
                    alert('Please allow popups for this website.');
                }
            }

            document.addEventListener('click', function (event) {

                var element = event.target;

                while (element && element !== document) {

                    if (element.classList &&
                        element.classList.contains('feedback-link')) {

                        event.preventDefault();

                        var encryptedId = element.getAttribute('data-id');

                        if (encryptedId) {
                            openFeedback(encryptedId);
                        }

                        return;
                    }

                    element = element.parentNode;
                }

            });

        </script>

        <script nonce="PjL3k8oXn5tvfIigOc/iOg==" type="text/javascript">
            // body onload ki jagah
            window.addEventListener("load", FocusOnInput);

            // Delegated click listener: UpdatePanel partial postback ke baad bhi chalta hai
            document.addEventListener("click", function (e) {
                var t = e.target;
                if (!t || !t.closest) { return; }

                // GridView pager links: href="javascript:__doPostBack('gvData','Page$2')"
                // javascript: URL CSP mein block hota hai, isliye href parse karke khud __doPostBack call karte hain
                var pgLink = t.closest('a[href^="javascript:__doPostBack"]');
                if (pgLink) {
                    var m = /__doPostBack\('([^']*)'\s*,\s*'([^']*)'\)/.exec(pgLink.getAttribute("href"));
                    if (m) {
                        e.preventDefault();
                        __doPostBack(m[1], m[2]);
                    }
                    return;
                }

                // Grid ke image links (img-1 / img-2)
                var imgLink = t.closest("a.img-view");
                if (imgLink) {
                    e.preventDefault();
                    LoadDiv(imgLink.getAttribute("data-url"));
                    return;
                }

                // Image popup ka close button
                if (t.id === "btnClose") {
                    HideDiv();
                    return;
                }

                // Search button: client-side validation (btnSearch par CausesValidation=false hai)
                if (t.id === "btnSearch") {
                    if (typeof Page_ClientValidate === "function" && !Page_ClientValidate("btnsearch")) {
                        e.preventDefault();
                    }
                }
            });

            // DropDownList ke auto postback ki jagah
            document.addEventListener("change", function (e) {
                var t = e.target;
                if (t && t.classList && t.classList.contains("js-autopostback")) {
                    __doPostBack(t.name, "");
                }
            });
        </script>
